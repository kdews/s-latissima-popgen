  # Library J Plate 3 (Run 1)
  "Library J Plate 3 (Run 1)":
    - type: regex
      pattern: "_J[A-Z]{3}_I1018_[ATGC]{8}_3_L1$"
  "Library J Plate 3 (Run 1) R1":
    - type: regex
      pattern: "_J[A-Z]{3}_I1018_[ATGC]{8}_3_L1_R1.*"
